# 自动构建 NVR Docker 镜像并推送到 GitHub Container Registry (GHCR)
# 触发条件：推送到 main 分支、打 v* 开头的 tag、手动触发
#
# 镜像地址：ghcr.io/dtqeight/nvr
# 标签策略：
#   - main 分支推送  -> ghcr.io/dtqeight/nvr:main  (滚动更新)
#   - 打 tag v1.2.3  -> ghcr.io/dtqeight/nvr:1.2.3 + :latest
#
# 架构：linux/amd64 + linux/arm64（兼容 x86 NAS 和 ARM NAS 如群晖 DS223）
#
# 注意：go.sum 不提交到仓库，由 Dockerfile 内 `go mod tidy` 自动生成

name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  BUILDKIT_PROGRESS: plain

jobs:
  # 预检：快速暴露编译错误，失败立即终止，不浪费时间到 docker 构建上
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false  # 仓库无 go.sum，关闭缓存避免警告
      - name: go mod tidy + go vet + build（打印完整错误）
        run: |
          go mod tidy
          go vet ./...
          go build ./... 2>&1 || { echo "=== 编译失败，上方为完整错误 ==="; exit 1; }

  prepare:
    needs: precheck
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    permissions:
      contents: read

    steps:
      - name: 生成小写镜像名
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 AMD64 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.image }}:build-${{ github.sha }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    needs: prepare
    # Native GitHub-hosted ARM64 runner: no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ARM64 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image }}:build-${{ github.sha }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  publish-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成发布标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 合并并发布多架构镜像
        shell: bash
        env:
          AMD64_IMAGE: ${{ needs.prepare.outputs.image }}:build-${{ github.sha }}-amd64
          ARM64_IMAGE: ${{ needs.prepare.outputs.image }}:build-${{ github.sha }}-arm64
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "$tag" \
              "$AMD64_IMAGE" \
              "$ARM64_IMAGE"
          done <<< "$TAGS"
