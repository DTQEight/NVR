<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVR - 摄像头直播</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #1a1a1a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #2a2a2a;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #3a3a3a;
        }
        header h1 { font-size: 18px; font-weight: 500; }
        .status { font-size: 12px; color: #888; }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: #222;
            border-right: 1px solid #333;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 13px;
            color: #888;
            padding: 12px 16px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .device-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background .15s;
        }
        .device-item:hover { background: #2d2d2d; }
        .device-item.active { background: #3a3a3a; }
        .device-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #555;
        }
        .device-item.enabled .device-dot { background: #4caf50; }
        .device-name { font-size: 14px; flex: 1; }
        .device-type { font-size: 11px; color: #777; }
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .empty {
            color: #666;
            text-align: center;
        }
        .empty h3 { margin-bottom: 8px; font-weight: 400; }
        .toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,.6);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }
        .toolbar.show { display: block; }
        .actions {
            padding: 12px 16px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 8px;
        }
        .actions button { flex: 1; }
        button {
            width: 100%;
            padding: 8px;
            background: #4a7cff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: #3a6cef; }
        button.secondary {
            background: #3a3a3a;
        }
        button.secondary:hover { background: #444; }
        button.danger {
            background: #c0392b;
        }
        button.danger:hover { background: #a93226; }

        /* 添加设备弹窗 */
        .modal-mask {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: #222;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 20px;
            width: 420px;
            max-width: 90vw;
        }
        .modal h3 { margin-bottom: 16px; font-weight: 500; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            color: #eee;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .form-group .hint {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .modal-actions button { flex: 1; }
        .device-item .del-btn {
            background: transparent;
            color: #777;
            padding: 2px 6px;
            width: auto;
            font-size: 12px;
        }
        .device-item .del-btn:hover { color: #ff6b6b; background: transparent; }
        .error {
            color: #ff6b6b;
            font-size: 12px;
            padding: 8px 16px;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <header>
        <h1>NVR 直播</h1>
        <div class="status" id="status">连接中...</div>
    </header>
    <div class="main">
        <aside class="sidebar">
            <h2>设备列表</h2>
            <div id="deviceList"></div>
            <div class="actions">
                <button onclick="refreshDevices()">刷新</button>
                <button class="secondary" onclick="showAddModal()">+ 添加</button>
            </div>
            <div class="error" id="error"></div>
        </aside>
        <main class="content">
            <div class="empty" id="empty">
                <h3>未选择摄像头</h3>
                <p>从左侧选择一个设备开始观看</p>
            </div>
            <video id="video" autoplay muted playsinline style="display:none"></video>
            <div class="toolbar" id="toolbar"></div>
        </main>
    </div>

    <!-- 添加设备弹窗 -->
    <div class="modal-mask" id="addModal" onclick="if(event.target===this)closeAddModal()">
        <div class="modal">
            <h3>添加摄像头</h3>
            <div class="form-group">
                <label>设备 ID（英文/数字，唯一）</label>
                <input id="f_id" placeholder="如：cam1" required>
            </div>
            <div class="form-group">
                <label>显示名称</label>
                <input id="f_name" placeholder="如：客厅摄像头" required>
            </div>
            <div class="form-group">
                <label>类型</label>
                <select id="f_type">
                    <option value="rtsp">RTSP（标准摄像头）</option>
                    <option value="xiaomi">小米摄像头</option>
                </select>
            </div>
            <div class="form-group">
                <label>源地址（go2rtc source）</label>
                <input id="f_source" placeholder="rtsp://用户名:密码@IP:554/路径" required>
                <div class="hint" id="source_hint">标准 RTSP 地址，如 rtsp://admin:pass@192.168.1.100:554/stream</div>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="f_enabled" checked style="width:auto;margin-right:6px">立即启用</label>
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeAddModal()">取消</button>
                <button onclick="submitAddDevice()">添加</button>
            </div>
            <div class="error" id="addError" style="margin-top:12px"></div>
        </div>
    </div>

<script>
const API = '/api/v1';
let currentDevice = null;
let pc = null; // RTCPeerConnection

async function refreshDevices() {
    const status = document.getElementById('status');
    const errorEl = document.getElementById('error');
    status.textContent = '加载设备...';
    errorEl.classList.remove('show');
    try {
        const res = await fetch(`${API}/devices`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderDevices(data.devices || []);
        status.textContent = `共 ${data.devices ? data.devices.length : 0} 个设备`;
    } catch (e) {
        status.textContent = '加载失败';
        errorEl.textContent = '设备列表加载失败: ' + e.message;
        errorEl.classList.add('show');
    }
}

function renderDevices(devices) {
    const list = document.getElementById('deviceList');
    if (!devices.length) {
        list.innerHTML = '<div style="padding:16px;color:#666;font-size:13px">暂无设备，点击下方"+ 添加"按钮</div>';
        return;
    }
    list.innerHTML = devices.map(d => `
        <div class="device-item ${d.enabled ? 'enabled' : ''} ${currentDevice && currentDevice.id === d.id ? 'active' : ''}"
             data-id="${d.id}" onclick="playDevice('${d.id}')">
            <span class="device-dot"></span>
            <span class="device-name">${escapeHtml(d.name)}</span>
            <span class="device-type">${d.type}</span>
            <button class="del-btn" onclick="event.stopPropagation();deleteDevice('${d.id}','${escapeHtml(d.name)}')">删除</button>
        </div>
    `).join('');
}

async function playDevice(id) {
    // 获取设备信息
    try {
        const res = await fetch(`${API}/devices/${id}`);
        if (!res.ok) throw new Error('设备不存在');
        currentDevice = await res.json();
    } catch (e) {
        showError(e.message);
        return;
    }

    // 更新选中状态
    document.querySelectorAll('.device-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
    });

    // 显示播放器
    document.getElementById('empty').style.display = 'none';
    const video = document.getElementById('video');
    video.style.display = 'block';
    const toolbar = document.getElementById('toolbar');
    toolbar.classList.add('show');
    toolbar.textContent = currentDevice.name + ' (' + currentDevice.type + ')';

    // 启动 WebRTC 播放
    await startWebRTC(currentDevice.id);
}

async function startWebRTC(src) {
    // 关闭旧连接
    if (pc) {
        pc.close();
        pc = null;
    }
    const video = document.getElementById('video');

    try {
        pc = new RTCPeerConnection({
            iceServers: [] // 局域网不需要 STUN
        });
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });
        pc.ontrack = (ev) => {
            video.srcObject = ev.streams[0];
        };
        pc.onconnectionstatechange = () => {
            const status = document.getElementById('status');
            if (pc.connectionState === 'connected') {
                status.textContent = '播放中';
            } else if (pc.connectionState === 'failed') {
                showError('WebRTC 连接失败');
            }
        };

        // 创建 offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // 等待 ICE 收集完成（局域网很快）
        await new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') return resolve();
            pc.onicegatheringstatechange = () => {
                if (pc.iceGatheringState === 'complete') resolve();
            };
            // 超时保护
            setTimeout(resolve, 2000);
        });

        // 发给 go2rtc（通过 NVR 代理）
        const res = await fetch(`/api/webrtc?src=${encodeURIComponent(src)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/sdp' },
            body: pc.localDescription.sdp
        });

        if (!res.ok) {
            const text = await res.text();
            throw new Error('go2rtc 返回错误: ' + text);
        }

        const answerSdp = await res.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
    } catch (e) {
        showError('WebRTC 启动失败: ' + e.message);
    }
}

function showError(msg) {
    const errorEl = document.getElementById('error');
    errorEl.textContent = msg;
    errorEl.classList.add('show');
    document.getElementById('status').textContent = '错误';
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

// ---------- 添加设备 ----------

function showAddModal() {
    document.getElementById('addModal').classList.add('show');
    document.getElementById('addError').classList.remove('show');
    // 聚焦第一个输入框
    setTimeout(() => document.getElementById('f_id').focus(), 50);
}

function closeAddModal() {
    document.getElementById('addModal').classList.remove('show');
    // 清空表单
    ['f_id','f_name','f_source'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_type').value = 'rtsp';
    document.getElementById('f_enabled').checked = true;
}

// 类型切换时更新提示
document.getElementById('f_type').addEventListener('change', e => {
    const hint = document.getElementById('source_hint');
    const placeholder = document.getElementById('f_source');
    if (e.target.value === 'xiaomi') {
        placeholder.placeholder = 'xiaomi://账号ID:地区@摄像头IP?did=设备DID&model=型号';
        hint.textContent = '小米源地址，需要先在 go2rtc WebUI 登录小米账号获取';
    } else {
        placeholder.placeholder = 'rtsp://用户名:密码@IP:554/路径';
        hint.textContent = '标准 RTSP 地址，如 rtsp://admin:pass@192.168.1.100:554/stream';
    }
});

async function submitAddDevice() {
    const addError = document.getElementById('addError');
    addError.classList.remove('show');

    const id = document.getElementById('f_id').value.trim();
    const name = document.getElementById('f_name').value.trim();
    const type = document.getElementById('f_type').value;
    const source = document.getElementById('f_source').value.trim();
    const enabled = document.getElementById('f_enabled').checked;

    if (!id || !name || !source) {
        addError.textContent = '请填写所有必填项';
        addError.classList.add('show');
        return;
    }

    try {
        const res = await fetch(`${API}/devices`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, name, type, source, enabled })
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || 'HTTP ' + res.status);
        }
        closeAddModal();
        await refreshDevices();
        // 自动选中新添加的设备
        playDevice(id);
    } catch (e) {
        addError.textContent = '添加失败: ' + e.message;
        addError.classList.add('show');
    }
}

// ---------- 删除设备 ----------

async function deleteDevice(id, name) {
    if (!confirm(`确认删除设备「${name}」？`)) return;
    try {
        const res = await fetch(`${API}/devices/${id}`, { method: 'DELETE' });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || 'HTTP ' + res.status);
        }
        // 如果删的是当前播放的设备，停止播放
        if (currentDevice && currentDevice.id === id) {
            if (pc) { pc.close(); pc = null; }
            document.getElementById('video').style.display = 'none';
            document.getElementById('empty').style.display = 'block';
            document.getElementById('toolbar').classList.remove('show');
            currentDevice = null;
        }
        await refreshDevices();
    } catch (e) {
        alert('删除失败: ' + e.message);
    }
}

// 页面加载时自动刷新
refreshDevices();

// 按 ESC 关闭弹窗
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAddModal();
});
</script>
</body>
</html>
