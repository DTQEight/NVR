services:
  nvr:
    image: ghcr.io/dtqeight/nvr:latest
    container_name: nvr
    restart: unless-stopped
    ports:
      - "18800:8080"        # NVR Web UI（含 go2rtc WebUI 代理）
    environment:
      # 录像策略
      NVR_RECORD_SEGMENT_DURATION: "30"
      NVR_RECORD_KEEP_DAYS: "7"
      NVR_RECORD_FORMAT: "mp4"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./config:/app/config       # go2rtc 配置 + 小米登录数据持久化
