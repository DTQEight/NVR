services:
  nvr:
    image: ghcr.io/dtqeight/nvr:latest
    container_name: nvr
    restart: unless-stopped
    ports:
      - "18800:8080"        # NVR Web UI
      - "1984:1984"          # go2rtc WebUI（可选，调试用）
      - "8554:8554"          # go2rtc RTSP（可选，外部访问用）
    environment:
      # 录像策略
      NVR_RECORD_SEGMENT_DURATION: "30"
      NVR_RECORD_KEEP_DAYS: "7"
      NVR_RECORD_FORMAT: "mp4"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./config:/app/config       # go2rtc 配置 + 小米登录数据持久化
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
